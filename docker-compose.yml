
services:
  db:
    image: postgres:17-alpine
    container_name: sikrabtek-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sikrabtek}
      POSTGRES_USER: ${POSTGRES_USER:-sikrabtek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  # Jalankan secara manual saat setup database
  seed:
    build:
      context: .
      target: builder
    container_name: sikrabtek-seed
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sikrabtek}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sikrabtek}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run seed"
    profiles:
      - tools

  app:
    build:
      context: .
      target: runner
    container_name: sikrabtek-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sikrabtek}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sikrabtek}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
