services:
  backend:
    container_name: sikrabtek-backend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAIN_PACKAGE: ${MAIN_PACKAGE:-.}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    security_opt:
      - no-new-privileges:true